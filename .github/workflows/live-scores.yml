# Save this file as .github/workflows/live-scores.yml in the Golf-Pools repo.
#
# Requires a repo secret named DATAGOLF_API_KEY (Settings -> Secrets and variables ->
# Actions -> New repository secret). The key itself never appears in this file or in
# results.json - only inside the encrypted secret.
#
# Runs every 5 minutes. GitHub Actions free tier allows this on public repos at no cost;
# on private repos it draws from the monthly included minutes.

name: Update Live Pool Scores

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets Dale trigger a manual run from the Actions tab

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch live scores and publish results.json
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        run: python fetch_and_publish.py

      - name: Commit updated results.json
        run: |
          git config user.name "pool-live-scores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.json
          git diff --quiet --cached || git commit -m "Update live pool scores"
          git push
