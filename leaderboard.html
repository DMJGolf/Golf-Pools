<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board-bg: #16140f;
    --board-bg-2: #1e1b14;
    --slat-line: #34301f;
    --brass: #c9a34e;
    --brass-dim: #8a723a;
    --fairway: #2f5233;
    --fairway-dim: #223d26;
    --paper: #f3efe4;
    --paper-dim: #cfc9b8;
    --under-par: #d6423c;
    --over-par: #eef0ea;
    --even-par: #cfc9b8;
    --cut-gray: #6b6656;
    --highlight: #c9a34e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--board-bg);
    background-image:
      radial-gradient(ellipse at top, rgba(201,163,78,0.06), transparent 60%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 4rem;
  }

  header {
    background: linear-gradient(180deg, var(--fairway) 0%, var(--fairway-dim) 100%);
    padding: 2rem 1.5rem 1.75rem;
    text-align: center;
    border-bottom: 3px solid var(--brass);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 0.4rem;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    margin: 0;
    color: var(--paper);
  }

  .updated {
    margin-top: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--paper-dim);
  }

  .updated::before {
    content: "●";
    color: #58c46a;
    margin-right: 0.4em;
    font-size: 0.65rem;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  .lookup {
    margin-top: -1.4rem;
    background: var(--paper);
    border-radius: 6px;
    padding: 1.1rem 1.2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    position: relative;
    z-index: 2;
  }

  .lookup label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fairway-dim);
    margin-bottom: 0.4rem;
  }

  .lookup input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--paper-dim);
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    background: #fff;
    color: #1b1a17;
  }

  .lookup input:focus {
    outline: 2px solid var(--fairway);
    outline-offset: 1px;
  }

  .my-pairing-result {
    margin-top: 0.85rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--fairway-dim);
    min-height: 1.2rem;
  }

  section.board {
    margin-top: 2rem;
  }

  .board-title {
    font-family: 'Oswald', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    padding-left: 0.2rem;
  }

  .board-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .toggle-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--brass);
    background: transparent;
    border: 1px solid var(--brass-dim);
    border-radius: 4px;
    padding: 0.3rem 0.65rem;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    white-space: nowrap;
  }

  .toggle-count:hover {
    background: var(--brass);
    color: var(--board-bg);
  }

  .row {
    display: grid;
    grid-template-columns: 2.4rem 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.8rem;
    border-bottom: 1px solid var(--slat-line);
    transition: background 0.2s ease;
  }

  .row.highlighted {
    background: rgba(201,163,78,0.14);
    border-left: 3px solid var(--brass);
    padding-left: calc(0.8rem - 3px);
  }

  .rank {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 1rem;
    color: var(--brass-dim);
    text-align: center;
  }

  .row.highlighted .rank { color: var(--brass); }

  .entrant-info {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 0;
  }

  .entrant-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.01em;
  }

  .golfer-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--paper-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .score-tile {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 1.15rem;
    min-width: 2.6rem;
    text-align: center;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    background: #0c0b08;
    border: 1px solid var(--slat-line);
  }

  .score-tile.under { color: var(--under-par); }
  .score-tile.over { color: var(--over-par); }
  .score-tile.even { color: var(--even-par); }

  .cut-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cut-gray);
    padding: 0.25rem 0.5rem;
    border: 1px solid var(--cut-gray);
    border-radius: 4px;
  }

  section.board.cut .row { opacity: 0.65; }
  section.board.cut .entrant-name { color: var(--cut-gray); }

  footer {
    max-width: 760px;
    margin: 2.5rem auto 0;
    padding: 0 1.25rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--paper-dim);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .row { transition: none; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow" id="hdr-eyebrow">2026 The Open Championship</p>
  <h1>Pool Leaderboard</h1>
  <p class="updated" id="hdr-updated">Loading live scores&hellip;</p>
</header>

<main>
  <div class="lookup">
    <label for="entrant-search">Find your Pairing</label>
    <input type="text" id="entrant-search" placeholder="Type your name or label (e.g. Amy F)" autocomplete="off">
    <div class="my-pairing-result" id="my-pairing-result"></div>
  </div>

  <section class="board" id="live-board">
    <div class="board-title-row">
      <div class="board-title" id="board-title">Live &mdash; Top 10 Pairings</div>
      <button class="toggle-count" id="toggle-count" type="button">Show Top 20</button>
    </div>
    <div id="live-rows"></div>
  </section>

  <section class="board cut" id="cut-board" style="display:none;">
    <div class="board-title">Cut &mdash; No Longer in the Pool</div>
    <div id="cut-rows"></div>
  </section>
</main>

<footer>
  Scores update every 5 minutes via Data Golf &middot; Pairings lock at the start of Round&nbsp;1
</footer>

<script>
async function loadResults() {
  const res = await fetch('results.json?t=' + Date.now(), { cache: 'no-store' });
  return res.json();
}

function scoreClass(score) {
  if (score < 0) return 'under';
  if (score > 0) return 'over';
  return 'even';
}

function formatScore(score) {
  if (score === null || score === undefined) return '&mdash;';
  if (score === 0) return 'E';
  return score > 0 ? `+${score}` : `${score}`;
}

// Exact match only, against either the label ("Amy F") or full name ("Amy Foley") -
// per spec this is deliberately NOT a substring search, so "Amy" alone won't match.
function matchesQuery(entry, filter) {
  if (!filter) return false;
  const f = filter.trim().toLowerCase();
  return entry.label.toLowerCase() === f || entry.entrant_full_name.toLowerCase() === f;
}

function renderRow(entry, isHighlighted) {
  const golferNames = entry.golfers.map(g => g.name).join(' &middot; ');

  const row = document.createElement('div');
  row.className = 'row' + (isHighlighted ? ' highlighted' : '');

  if (entry.status === 'CUT') {
    row.innerHTML = `
      <div class="rank">&mdash;</div>
      <div class="entrant-info">
        <div class="entrant-name">${entry.label}</div>
        <div class="golfer-line">${golferNames}</div>
      </div>
      <div class="cut-tag">Cut</div>
    `;
  } else {
    row.innerHTML = `
      <div class="rank">${entry.rank}</div>
      <div class="entrant-info">
        <div class="entrant-name">${entry.label}</div>
        <div class="golfer-line">${golferNames}</div>
      </div>
      <div class="score-tile ${scoreClass(entry.total_score)}">${formatScore(entry.total_score)}</div>
    `;
  }
  return row;
}

function render(data, filterText) {
  const filter = (filterText || '').trim();

  document.getElementById('hdr-updated').textContent =
    'Last updated ' + new Date(data.last_updated).toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });

  const live = data.leaderboard.filter(e => e.status === 'LIVE');
  const cut = data.leaderboard.filter(e => e.status === 'CUT');

  document.getElementById('board-title').textContent = `Live \u2014 Top ${visibleCount} Pairings`;
  document.getElementById('toggle-count').textContent = visibleCount === 10 ? 'Show Top 20' : 'Show Top 10';

  const liveRowsEl = document.getElementById('live-rows');
  liveRowsEl.innerHTML = '';
  const topN = live.slice(0, visibleCount);
  topN.forEach(e => liveRowsEl.appendChild(renderRow(e, matchesQuery(e, filter))));

  // If the searched entrant has a live Pairing outside the visible list, show it separately
  const matchesOutsideTopN = filter
    ? live.filter(e => matchesQuery(e, filter) && !topN.includes(e))
    : [];
  if (matchesOutsideTopN.length) {
    const sep = document.createElement('div');
    sep.style.cssText = 'padding:0.5rem 0.8rem; font-family:"IBM Plex Mono",monospace; font-size:0.72rem; color:var(--paper-dim);';
    sep.textContent = 'Your Pairing:';
    liveRowsEl.appendChild(sep);
    matchesOutsideTopN.forEach(e => liveRowsEl.appendChild(renderRow(e, true)));
  }

  const cutRowsEl = document.getElementById('cut-rows');
  const cutBoard = document.getElementById('cut-board');
  cutRowsEl.innerHTML = '';
  const matchingCut = filter ? cut.filter(e => matchesQuery(e, filter)) : [];
  if (matchingCut.length) {
    cutBoard.style.display = '';
    matchingCut.forEach(e => cutRowsEl.appendChild(renderRow(e, true)));
  } else {
    cutBoard.style.display = 'none';
  }

  const resultMsg = document.getElementById('my-pairing-result');
  if (!filter) {
    resultMsg.textContent = '';
  } else {
    const foundLive = live.filter(e => matchesQuery(e, filter));
    const foundCut = cut.filter(e => matchesQuery(e, filter));
    const totalFound = foundLive.length + foundCut.length;
    if (totalFound === 0) {
      resultMsg.textContent = 'No Pairing found for that name.';
    } else if (foundLive.length === 0) {
      resultMsg.textContent = 'All of your Pairings have been cut — see below. You may be eligible for a free Pairing or even more in the next tournament — check with Dale.';
    } else {
      resultMsg.textContent = `Found ${totalFound} Pairing${totalFound > 1 ? 's' : ''} — highlighted above.`;
    }
  }
}

let currentData = null;
let visibleCount = 10;

loadResults().then(data => {
  currentData = data;
  render(data, '');
}).catch(() => {
  document.getElementById('hdr-updated').textContent = 'Unable to load live scores right now.';
});

document.getElementById('entrant-search').addEventListener('input', (e) => {
  if (currentData) render(currentData, e.target.value);
});

document.getElementById('toggle-count').addEventListener('click', () => {
  visibleCount = visibleCount === 10 ? 20 : 10;
  if (currentData) render(currentData, document.getElementById('entrant-search').value);
});

// Auto-refresh every 15 minutes to match the live data cadence
setInterval(() => {
  loadResults().then(data => {
    currentData = data;
    render(data, document.getElementById('entrant-search').value);
  });
}, 15 * 60 * 1000);
</script>

</body>
</html>
